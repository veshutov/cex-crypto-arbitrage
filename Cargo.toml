[package]
name = "hft"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.45.1", features = ["full"] }
tokio-tungstenite = { version = "0.26.2", features = ["native-tls"] }
reqwest = { version = "0.12.20", default-features = false, features = [
    "json",
    "rustls-tls",
] }

dashmap = "6.1.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
dotenvy = "0.15.7"
thiserror = "2.0.12"
anyhow = "1.0.98"
async-trait = "0.1.88"
futures = "0.3.31"
rust_decimal = "1.37.2"
rust_decimal_macros = "1.37.1"
hmac = "0.12.1"
sha2 = "0.10.9"
base64 = "0.22.1"
hex = "0.4.3"
uuid = { version = "1.17.0", features = ["v7"] }
ulid = "1.2.1"
flate2 = "1.0.28"
